name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
  containers:
    name: containers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use cached Docker Hub images when available
        run: |
          sudo python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('/etc/docker/daemon.json')
          config = json.loads(path.read_text()) if path.exists() else {}
          mirror = 'https://mirror.gcr.io'
          config['registry-mirrors'] = [mirror, *(item for item in config.get('registry-mirrors', []) if item != mirror)]
          path.write_text(json.dumps(config))
          PY
          sudo systemctl restart docker
          docker info >/dev/null
      - name: Validate production Compose
        env:
          POSTGRES_PASSWORD: ci-only-not-a-real-secret-12345678
        run: docker compose config --quiet
      - name: Build web and tooling images
        run: docker build --target web -t polymate-web:ci . && docker build --target tooling -t polymate-tooling:ci .
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exercise isolated production containers and backup restore
        run: bash scripts/container-check.sh
