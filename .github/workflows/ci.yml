name: CI
on:
  # Checks run on pull requests only; branches reach main through a PR whose checks already
  # passed, so a main push deploys directly. Docs-only changes skip CI and deploy.
  pull_request:
    paths-ignore: ['**.md']
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Superseded PR runs are cancelled. Each main push gets its own group so a newer
  # push never cancels a deploy midway; the deploy job serializes itself instead.
  group: ci-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true
jobs:
  checks:
    name: checks
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx', 'apps/web/**/*.css', 'packages/**/*.ts') }}
          restore-keys: next-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm check
  planner:
    name: planner
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Planner, planning API and SQL migration checks
        run: pnpm test:planner
  containers:
    name: containers
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    env:
      POSTGRES_IMAGE: mirror.gcr.io/library/postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    steps:
      - uses: actions/checkout@v4
      - name: Use cached Docker Hub images when available
        run: |
          sudo python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('/etc/docker/daemon.json')
          config = json.loads(path.read_text()) if path.exists() else {}
          mirror = 'https://mirror.gcr.io'
          config['registry-mirrors'] = [mirror, *(item for item in config.get('registry-mirrors', []) if item != mirror)]
          path.write_text(json.dumps(config))
          PY
          sudo systemctl restart docker
          docker info >/dev/null
      - name: Validate production Compose
        env:
          POSTGRES_PASSWORD: ci-only-not-a-real-secret-12345678
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
        with:
          # Shared runner IPs hit anonymous Docker Hub rate limits; pull through the GCR mirror.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          tags: polymate-web:ci
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Build tooling image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tooling
          tags: polymate-tooling:ci
          load: true
          cache-from: type=gha,scope=tooling
          cache-to: type=gha,scope=tooling,mode=max
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exercise isolated production containers and backup restore
        run: bash scripts/container-check.sh
  prepare:
    # Builds the release images on the VM before deploy, so deploy only finds cached images.
    # It never switches the live checkout or restarts anything.
    name: prepare
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: polymate-team07-prebuild
      cancel-in-progress: false
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Ignore a commit superseded by a newer main commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if test "$current_sha" = "$DEPLOY_SHA"; then
            echo 'proceed=true' >> "$GITHUB_OUTPUT"
          else
            echo "main is now $current_sha; the newer run will prebuild."
            echo 'proceed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install the CI-only VM key and pinned host key
        if: steps.current.outputs.proceed == 'true'
        env:
          VM_DEPLOY_KEY: ${{ secrets.POLYMATE_VM_DEPLOY_KEY }}
        run: |
          test -n "$VM_DEPLOY_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_DEPLOY_KEY" > "$HOME/.ssh/id_polymate_ci"
          chmod 600 "$HOME/.ssh/id_polymate_ci"
          install -m 600 .github/viscon_known_hosts "$HOME/.ssh/known_hosts"

      - name: Transfer the commit and prebuild its images on the VM
        if: steps.current.outputs.proceed == 'true'
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/polymate-$DEPLOY_SHA.bundle"
          git bundle create "$bundle" HEAD
          git bundle verify "$bundle"
          vm=viscon@07-direct.viscon-hackathon.ch
          key="$HOME/.ssh/id_polymate_ci"
          ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes "$vm" 'umask 077; mkdir -p /home/viscon/polymate-transfer'
          scp -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes "$bundle" "$vm:/home/viscon/polymate-transfer/polymate-$DEPLOY_SHA.bundle"
          # --no-write-fetch-head: the deploy job relies on FETCH_HEAD and may run concurrently.
          # The prebuild script comes from the pushed commit, not the live checkout.
          ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes "$vm" "set -e; umask 077; cd /home/viscon/polymate; git fetch --no-write-fetch-head /home/viscon/polymate-transfer/polymate-$DEPLOY_SHA.bundle HEAD; git cat-file -e '$DEPLOY_SHA^{commit}'; mkdir -p .release; script=.release/prebuild-$DEPLOY_SHA.sh; git show '$DEPLOY_SHA:scripts/prebuild.sh' > \"\$script\"; trap 'rm -f \"\$script\"' EXIT; bash \"\$script\" '$DEPLOY_SHA'"

  deploy:
    name: deploy
    needs: [prepare]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: polymate-team07-deploy
      cancel-in-progress: false
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Ignore a commit superseded by a newer main commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if test "$current_sha" = "$DEPLOY_SHA"; then
            echo 'proceed=true' >> "$GITHUB_OUTPUT"
          else
            echo "main is now $current_sha; the newer run will deploy."
            echo 'proceed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install the CI-only VM key and pinned host key
        if: steps.current.outputs.proceed == 'true'
        env:
          VM_DEPLOY_KEY: ${{ secrets.POLYMATE_VM_DEPLOY_KEY }}
        run: |
          test -n "$VM_DEPLOY_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VM_DEPLOY_KEY" > "$HOME/.ssh/id_polymate_ci"
          chmod 600 "$HOME/.ssh/id_polymate_ci"
          install -m 600 .github/viscon_known_hosts "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_polymate_ci" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes viscon@07-direct.viscon-hackathon.ch 'test "$(id -un)" = viscon'

      - name: Set up Node.js for secret transfer
        if: steps.current.outputs.proceed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Transfer the commit and deploy it on the VM
        if: steps.current.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.sha }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CLIENT_ROTATION_FROM: ${{ vars.GOOGLE_CLIENT_ROTATION_FROM }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          OAUTH_STATE_SECRET: ${{ secrets.OAUTH_STATE_SECRET }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if test "$current_sha" != "$DEPLOY_SHA"; then
            echo "Skipping superseded commit $DEPLOY_SHA."
            exit 0
          fi
          bundle="$RUNNER_TEMP/polymate-$DEPLOY_SHA.bundle"
          git bundle create "$bundle" HEAD
          git bundle verify "$bundle"
          vm=viscon@07-direct.viscon-hackathon.ch
          key="$HOME/.ssh/id_polymate_ci"
          ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes "$vm" 'umask 077; mkdir -p /home/viscon/polymate-transfer'
          scp -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes "$bundle" "$vm:/home/viscon/polymate-transfer/polymate-$DEPLOY_SHA.bundle"
          node -e '
            const names = ["GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET", "TOKEN_ENCRYPTION_KEY", "OAUTH_STATE_SECRET"];
            for (const name of names) if (!process.env[name]) throw new Error(`Missing GitHub Actions secret: ${name}`);
            process.stdout.write(JSON.stringify({
              ...Object.fromEntries(names.map(name => [name, process.env[name]])),
              GOOGLE_CLIENT_ROTATION_FROM: process.env.GOOGLE_CLIENT_ROTATION_FROM,
            }));
          ' | ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes "$vm" "set -e; umask 077; cd /home/viscon/polymate; git fetch /home/viscon/polymate-transfer/polymate-$DEPLOY_SHA.bundle HEAD; test \"\$(git rev-parse FETCH_HEAD)\" = '$DEPLOY_SHA'; mkdir -p .release; git show FETCH_HEAD:scripts/install-google-env.mjs > .release/install-google-env.mjs; node .release/install-google-env.mjs; scripts/deploy.sh FETCH_HEAD"
